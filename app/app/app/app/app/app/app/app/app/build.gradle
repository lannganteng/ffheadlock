<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<style>
 html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
 #cv{position:fixed;left:0;top:0}
</style></head><body><canvas id="cv"></canvas><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;
 cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));fit();

let C={radius:200,offX:0,offY:0,guide:true,debug:true,lead:0,on:true};
let TG=[],PREV=[],VX=[],VY=[],cur=[];
const LAT=90;

window.FFOverlay={
 cfg:o=>Object.assign(C,o),
 targets:a=>{TG=a||[];}
};

let last=performance.now();
(function loop(now){
 const dt=Math.max(1,Math.min(now-last,100));last=now;
 const cx=W/2+C.offX,cy=H/2+C.offY;

 for(let i=0;i<TG.length;i++){
  if(PREV[i]&&TG[i]){VX[i]=(TG[i][0]-PREV[i][0])/dt;VY[i]=(TG[i][1]-PREV[i][1])/dt;}
  else{VX[i]=VY[i]=0;}
  PREV[i]=TG[i]?[TG[i][0],TG[i][1]]:null;
  cur[i]=TG[i]?[TG[i][0]+(VX[i]||0)*LAT*C.lead,
                 TG[i][1]+(VY[i]||0)*LAT*C.lead]:null;
 }
 if(TG.length===0) PREV=[];

 draw(cx,cy);
 requestAnimationFrame(loop);
})(performance.now());

function draw(cx,cy){
 ctx.clearRect(0,0,W,H);
 const p0=(TG.length&&cur[0])?cur[0]:null;
 const err=p0?Math.hypot(p0[0]-cx,p0[1]-cy):1e9;
 const locked=p0&&err<C.radius;
 const ready=p0&&err<14;

 ctx.setLineDash([5,7]);
 ctx.strokeStyle=ready?'rgba(0,255,120,.9)':(locked?'rgba(255,168,0,.8)':'rgba(0,255,168,.26)');
 ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,C.radius,0,7);ctx.stroke();
 ctx.setLineDash([]);

 for(let i=1;i<TG.length;i++){
  ctx.strokeStyle='rgba(255,59,92,.35)';ctx.lineWidth=1.5;
  bracket(TG[i][0],TG[i][1],Math.max(16,TG[i][2]*0.9));
 }

 if(p0){
  const r=Math.max(18,TG[0][2]*1.0);

  if(C.guide){
   ctx.setLineDash([3,4]);
   ctx.strokeStyle=ready?'rgba(0,255,120,.55)':'rgba(255,59,92,.35)';
   ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p0[0],p0[1]);ctx.stroke();
   ctx.setLineDash([]);
  }

  if(C.guide&&err>C.radius){
   const a=Math.atan2(p0[1]-cy,p0[0]-cx);
   const ox=cx+Math.cos(a)*54, oy=cy+Math.sin(a)*54;
   ctx.save();ctx.translate(ox,oy);ctx.rotate(a);
   ctx.fillStyle='rgba(255,59,92,.85)';
   ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-5,6);ctx.lineTo(-5,-6);
   ctx.closePath();ctx.fill();ctx.restore();
  }

  ctx.strokeStyle=ready?'#00ff78':'#ff3b5c';ctx.lineWidth=2.5;
  bracket(p0[0],p0[1],r);

  ctx.fillStyle=ready?'#00ff78':'#ff3b5c';
  ctx.beginPath();ctx.arc(p0[0],p0[1],3,0,7);ctx.fill();

  if(locked){
   const pl=Math.sin(performance.now()/110)*0.5+0.5;
   ctx.strokeStyle='rgba(255,59,92,'+(0.4*pl)+')';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.arc(p0[0],p0[1],r*(1.25+pl*0.5),0,7);ctx.stroke();
  }

  ctx.font='500 10px monospace';ctx.textAlign='left';
  ctx.fillStyle=ready?'#00ff78':'#ff3b5c';
  ctx.fillText(ready?'KEPALA - TEMBAK!':'KEPALA',p0[0]+r+7,p0[1]-r+9);
  ctx.font='9px monospace';ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(Math.round(err)+' px',p0[0]+r+7,p0[1]-r+21);

  if(C.debug){
   ctx.strokeStyle='rgba(0,180,255,.55)';ctx.lineWidth=1;
   ctx.strokeRect(TG[0][0]-TG[0][2]/2,TG[0][1]-H*0.035,TG[0][2],H*0.035);
  }
 }

 ctx.strokeStyle=ready?'#00ff78':(C.on?'#00ffa8':'#8aa0a8');
 ctx.lineWidth=2;ctx.lineCap='round';
 const g=10,l=14;
 ctx.beginPath();
 ctx.moveTo(cx-g-l,cy);ctx.lineTo(cx-g,cy);
 ctx.moveTo(cx+g,cy);ctx.lineTo(cx+g+l,cy);
 ctx.moveTo(cx,cy-g-l);ctx.lineTo(cx,cy-g);
 ctx.moveTo(cx,cy+g);ctx.lineTo(cx,cy+g+l);
 ctx.stroke();
 ctx.fillStyle=ctx.strokeStyle;ctx.fillRect(cx-1,cy-1,2,2);

 if(ready){
  ctx.font='500 13px monospace';ctx.textAlign='center';
  ctx.fillStyle='#00ff78';
  ctx.fillText('TEMBAK',cx,cy+g+l+18);
 }
}

function bracket(x,y,r){
 const L=r*0.5;
 [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(c=>{
  ctx.beginPath();
  ctx.moveTo(x+c[0]*r,y+c[1]*r-c[1]*L);
  ctx.lineTo(x+c[0]*r,y+c[1]*r);
  ctx.lineTo(x+c[0]*r-c[0]*L,y+c[1]*r);
  ctx.stroke();
 });
}
</script></body></html>
